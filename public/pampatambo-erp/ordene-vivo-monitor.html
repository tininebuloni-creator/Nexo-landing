  :root { color-scheme: dark; }

  header h1 { font-size:16px; margin:0; }

  .card.alerta { border-color:#dc2626; box-shadow:0 0 0 1px rgba(220,38,38,.4) inset; }

  .metrica { background:#0f172a; border-radius:8px; padding:8px 10px; }
  .metrica .label { font-size:11px; color:#94a3b8; }
  .metrica .valor { font-size:18px; font-weight:600; }
  .alertas { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .alerta-item { background:rgba(220,38,38,.15); color:#fca5a5; border-radius:8px; padding:6px 8px; font-size:12px; }
  .vacio { color:#94a3b8; text-align:center; padding:60px 20px; font-size:14px; }
  .cerradas { margin-top:28px; }
  .cerradas h2 { font-size:14px; color:#94a3b8; text-transform:uppercase; letter-spacing:.04em; }
  .fila-cerrada { display:flex; justify-content:space-between; font-size:13px; padding:8px 10px; border-bottom:1px solid #1e293b; color:#cbd5e1; }
  a.link-carga { color:#7dd3fc; text-decoration:none; font-size:12px; }
