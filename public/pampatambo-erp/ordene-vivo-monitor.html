<style>
  :root { color-scheme: dark; }

  header { padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid #1e293b; position:sticky; top:0; background:#0f172a; z-index:5; }
  header h1 { font-size:16px; margin:0; }
  .estado-conn { font-size:12px; display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; }
  .estado-conn.ok { background:rgba(34,197,94,.15); color:#86efac; }
  .estado-conn.mal { background:rgba(239,68,68,.2); color:#fca5a5; }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
  main { padding:16px; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .card { background:#151f38; border:1px solid #1e293b; border-radius:12px; padding:14px; }
  .card.alerta { border-color:#dc2626; box-shadow:0 0 0 1px rgba(220,38,38,.4) inset; }
  .card h3 { margin:0 0 4px; font-size:18px; }
  .card .sub { color:#94a3b8; font-size:12px; margin-bottom:10px; }
  .metricas { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px; }
  .metrica { background:#0f172a; border-radius:8px; padding:8px 10px; }
  .metrica .label { font-size:11px; color:#94a3b8; }
  .metrica .valor { font-size:18px; font-weight:600; }
  .alertas { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .alerta-item { background:rgba(220,38,38,.15); color:#fca5a5; border-radius:8px; padding:6px 8px; font-size:12px; }
  .vacio { color:#94a3b8; text-align:center; padding:60px 20px; font-size:14px; }
  .cerradas { margin-top:28px; }
  .cerradas h2 { font-size:14px; color:#94a3b8; text-transform:uppercase; letter-spacing:.04em; }
  .fila-cerrada { display:flex; justify-content:space-between; font-size:13px; padding:8px 10px; border-bottom:1px solid #1e293b; color:#cbd5e1; }
  a.link-carga { color:#7dd3fc; text-decoration:none; font-size:12px; }
</style>

  <header>
    <h1>📊 Monitor de ordeñe en vivo</h1>

    <p style="color:#94a3b8;font-size:12px;margin-top:0;">Carga manual desde <a class="link-carga" href="./ordene-vivo-carga.html">ordene-vivo-carga.html</a> mientras no haya caudalímetros/sensores instalados. Solo funciona en la red WiFi del tambo (no hace falta internet).</p>

    <div class="cerradas">

    </div>
  </main>
