  main { padding:16px; max-width:480px; margin:0 auto; padding-bottom:100px; }

  #btnCerrar { background:#1e293b; color:#e2e8f0; }

  <header>
    <h1>🥛 Carga de ordeñe en vivo</h1>
    <div class="sub">Carga manual mientras no haya caudalímetros/sensores instalados. Un dato por puesto, actualizalo cada vez que cambie.</div>
  </header>
  <main>
    <label for="bajadaId">Puesto / bajada</label>
    <input id="bajadaId" inputmode="text" placeholder="Ej: 1, 2, Fosa A...">

    <label for="caravana">Caravana (RP) — opcional</label>
    <input id="caravana" inputmode="text" placeholder="Ej: 1234">

    <div class="fila2">
      <div>
        <label for="litrosActual">Litros acumulados</label>
        <input id="litrosActual" type="number" step="0.1" min="0" inputmode="decimal">
      </div>
      <div>
        <label for="litrosMin">Flujo (L/min)</label>
        <input id="litrosMin" type="number" step="0.1" min="0" inputmode="decimal">
      </div>
    </div>

    <div class="fila2">
      <div>
        <label for="temperatura">Temperatura (°C)</label>
        <input id="temperatura" type="number" step="0.1" inputmode="decimal">
      </div>
      <div>
        <label for="conductividad">Conductividad (mS/cm)</label>
        <input id="conductividad" type="number" step="0.1" min="0" inputmode="decimal">
      </div>
    </div>

    <label for="tiempoMin">Tiempo ordeñando (minutos)</label>
    <input id="tiempoMin" type="number" step="0.5" min="0" inputmode="decimal">

    <div id="estadoMsg"></div>
    <div id="pendientesMsg" class="pendientes" style="display:none;"></div>
  </main>
  <div class="acciones">
    <button id="btnActualizar">Actualizar</button>
    <button id="btnCerrar">Cerrar puesto</button>
  </div>
