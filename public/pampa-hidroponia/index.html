<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pampa Hidroponía ERP</title>
<meta name="description" content="ERP de producción hidropónica: cultivos, sectores, solución nutritiva, sensores, cosecha, trazabilidad y rentabilidad.">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PampaHidro">
<link rel="icon" href="pampa/logo-sm-esquina.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* === CSS VARIABLES === */
:root {
  --bg-primary: #0f1419;
  --bg-secondary: #1a1f2e;
  --bg-tertiary: #252b3b;
  --bg-card: #1e2433;
  --border: #2d3548;
  --border-light: #3d4558;
  --green: #f59e0b;
  --green-dim: #d97706;
  --green-glow: rgba(245,158,11,0.15);
  --blue: #3b82f6;
  --blue-dim: #2563eb;
  --purple: #8b5cf6;
  --orange: #f97316;
  --red: #ef4444;
  --yellow: #eab308;
  --cyan: #06b6d4;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-dim: #64748b;
  --font-main: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sidebar-w: 280px;
  --header-h: 60px;
  --radius: 8px;
  --radius-lg: 12px;
}

/* === RESET === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
}

/* === LAYOUT === */
.app { display: flex; height: 100vh; }

/* === SIDEBAR === */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  overflow-y: auto;
  scroll-behavior: smooth;
}

/* Estilo del scrollbar en sidebar */
.sidebar::-webkit-scrollbar {
  width: 8px;
}
.sidebar::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}
.sidebar::-webkit-scrollbar-thumb:hover {
  background: var(--text-dim);
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.logo-icon {
  width: 140px; height: 140px;
  background: url('logo2.png') center/contain no-repeat;
  display: flex; align-items: center; justify-content: center;
  padding: 10px;
  border-radius: 16px;
  background-color: rgba(255,255,255,0.08);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
.logo-text { font-weight: 700; font-size: 16px; text-align: center; }
.logo-sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); text-align: center; }

/* Portada Empresa - Dashboard */
.empresa-portada {
  position: relative;
  background: linear-gradient(135deg, #0f5132 0%, #14532d 40%, #1a7f3e 100%);
  border-radius: 12px;
  padding: 12px 20px 24px 20px;
  margin-bottom: 0;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  border: 1px solid rgba(245, 158, 11, 0.16);
  min-height: 420px;
}
.dashboard-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-items: start;
  margin-bottom: 18px;
}
.dashboard-empresa-col {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 10px;
}
.empresa-portada::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.empresa-portada::after {
  content: '🌾';
  position: absolute;
  right: 24px; bottom: -20px;
  font-size: 160px;
  opacity: 0.08;
  pointer-events: none;
}
.empresa-portada-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  justify-content: center;
  height: 100%;
}
.empresa-portada-logo {
  width: 480px; height: 280px;
  background-color: transparent;
  background-image: url('logo2.png');
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
  border-radius: 0;
  flex-shrink: 0;
  border: none;
}
.empresa-portada-info { 
  flex: 1; 
  min-width: 260px; 
  text-align: center;
  width: 100%;
}
.empresa-portada-nombre {
  font-size: 28px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  text-align: center;
}
.empresa-portada-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  font-family: var(--font-mono);
  margin-bottom: 10px;
}
.empresa-portada-datos {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: 11px;
  color: rgba(255,255,255,0.9);
  justify-content: center;
}
.empresa-portada-datos span { display: inline-flex; align-items: center; gap: 6px; }
.empresa-portada-datos strong { color: #fff; font-weight: 600; }
.empresa-portada-fecha {
  position: relative;
  z-index: 2;
  text-align: right;
  color: rgba(255,255,255,0.85);
  font-family: var(--font-mono);
  font-size: 12px;
  padding-top: 4px;
}
.dashboard-top-actions {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dashboard-top-actions-title {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: var(--font-mono);
}
.dashboard-date-chip {
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 10px;
}
.dashboard-date-chip strong {
  color: var(--text-primary);
  font-weight: 600;
}
.dashboard-top-actions-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.dashboard-action-btn {
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.dashboard-action-btn:hover {
  border-color: var(--green);
  color: var(--green);
}
.wa-mini-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  margin-right: 10px;
  border-radius: 50%;
  background: #25d366;
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  flex-shrink: 0;
}
.dashboard-action-btn.whatsapp-action {
  grid-column: 1 / -1;
  justify-self: center;
  width: min(100%, 220px);
  min-height: 46px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  font-size: 12px;
}
.dashboard-action-btn.whatsapp-action .wa-mini-icon {
  width: 30px;
  height: 30px;
  font-size: 11px;
  margin-right: 10px;
}
.dashboard-role-select {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.dashboard-role-select:focus {
  outline: none;
  border-color: var(--green);
}
.dashboard-sync-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.portada-market-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
  margin-top: auto;
  margin-bottom: auto;
}
.empresa-portada-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.empresa-portada-tool-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-light);
  background: var(--bg-card);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 12px;
  min-height: 40px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.empresa-portada-tool-btn:hover {
  background: var(--bg-tertiary);
  border-color: var(--green);
  transform: translateY(-1px);
}
@media (max-width: 640px) {
  .dashboard-hero {
    grid-template-columns: 1fr;
  }
  .dashboard-top-actions-grid {
    grid-template-columns: 1fr;
  }
  .empresa-portada { padding: 20px; }
  .empresa-portada-nombre { font-size: 22px; }
  .empresa-portada-content { gap: 16px; }
  .logo-icon { width: 115px; height: 115px; }
  .empresa-portada-logo { width: 76px; height: 76px; }
  .empresa-portada-tool-btn {
    width: 100%;
    text-align: left;
  }
}

.sidebar-nav { flex: 1; padding: 16px 12px; }
.nav-section { margin-bottom: 20px; }
.nav-section-title {
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 12px 12px 8px 12px;
  margin-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all 0.15s;
  user-select: none;
}
.nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.nav-item.active {
  background: var(--green-glow);
  color: var(--green);
  font-weight: 500;
}
.nav-icon { width: 20px; text-align: center; font-size: 16px; }
.nav-badge {
  margin-left: auto;
  font-size: 10px;
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--text-dim);
}

.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 2100;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 2050;
}

.sidebar-backdrop.active {
  display: block;
}

/* === MAIN === */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main.dashboard-compact .topbar { display: none; }
.topbar {
  height: var(--header-h);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}
.topbar { display: none !important; }
.topbar-title { font-weight: 600; font-size: 16px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.topbar-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.topbar-btn:hover { border-color: var(--green); color: var(--green); }
.topbar-btn.primary { background: var(--green); color: white; border-color: var(--green); }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 8px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* === MODULES === */
.module { display: none; animation: fadeIn 0.3s ease; }
.module.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* === CARDS === */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }

/* === KPI CARDS === */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.kpi.green::before { background: var(--green); }
.kpi.blue::before { background: var(--blue); }
.kpi.purple::before { background: var(--purple); }
.kpi.orange::before { background: var(--orange); }
.kpi.red::before { background: var(--red); }
.kpi.cyan::before { background: var(--cyan); }
.kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.kpi-value { font-size: 28px; font-weight: 700; font-family: var(--font-mono); }
.kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

/* === GRIDS === */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

/* === TABLES === */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left;
  padding: 12px;
  background: var(--bg-tertiary);
  color: var(--text-dim);
  font-weight: 500;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}
.data-table tr:hover td { background: rgba(16,185,129,0.03); }

/* === TAGS === */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.tag.green { background: rgba(16,185,129,0.15); color: var(--green); }
.tag.blue { background: rgba(59,130,246,0.15); color: var(--blue); }
.tag.orange { background: rgba(245,158,11,0.15); color: var(--orange); }
.tag.red { background: rgba(239,68,68,0.15); color: var(--red); }

/* === CHARTS === */
.chart-container { position: relative; height: 300px; }

/* === FORMS === */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.form-input, .form-select {
  width: 100%;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.form-input:focus, .form-select:focus { border-color: var(--green); }
.form-row { display: flex; gap: 12px; }

    <nav class="sidebar-nav"><div id="hidroMenu"></div></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title" id="topbarTitle">Dashboard</span>
      <div class="topbar-right">
        <div class="sync-status offline" id="syncStatus" data-ir="sincronizacion" title="Estado de conexión y sincronización">
          <span class="sync-icon">⚡</span><span class="sync-text">Sin conexión</span>
        </div>
        <select class="topbar-btn" data-hidro-rol title="Rol activo" style="background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer"></select>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Formulario de alta y edición (lo usan todos los módulos) -->
<div class="modal-overlay" id="formModal">

    <div class="modal-header"><div class="modal-title" id="formModalTitle">Nuevo registro</div><button type="button" class="modal-close" data-cerrar-form aria-label="Cerrar">✕</button></div>
    <div class="modal-body" id="formModalBody"></div>
    <div class="modal-footer"><button type="button" class="btn" data-cerrar-form>Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>
  </form>
</div>

<!-- Importación de datos históricos desde Excel -->
<div class="modal-overlay" id="importModal">
  <div class="modal modal-wide">
    <div class="modal-header"><div class="modal-title" id="importTitle">Importar desde Excel</div><button type="button" class="modal-close" data-cerrar-import aria-label="Cerrar">✕</button></div>
    <div class="modal-body" id="importBody"></div>
    <div class="modal-footer"><button type="button" class="btn" data-cerrar-import>Cancelar</button><button type="button" class="btn btn-primary" id="importConfirm" style="display:none">Importar</button></div>
  </div>
</div>

<!-- Activación de licencia (versión de escritorio) -->
<div class="activation-overlay" id="activationOverlay" style="display:none">
  <div class="activation-container">
    <div class="activation-header"><div class="activation-logo"></div><div class="activation-title">Pampa Hidroponía</div><div class="activation-subtitle">ERP de producción hidropónica</div></div>
    <div class="activation-form">
      <label class="activation-label" for="activationKey">Licencia de activación</label>
      <textarea class="activation-input" id="activationKey" rows="4" placeholder="Pegá acá el token PAMPAN1 completo" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button class="activation-btn-secondary" type="button" onclick="pasteLicenseFromClipboard()">Pegar desde portapapeles</button>
      <div class="activation-error" id="activationError">Clave de activación inválida</div>
      <button class="activation-btn" type="button" onclick="activateLicense()">Activar</button>
      <div class="activation-info">¿No tenés licencia? Escribinos por WhatsApp desde la web de Pampa N.</div>
    </div>
  </div>
</div>
