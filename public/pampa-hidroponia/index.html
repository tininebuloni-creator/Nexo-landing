<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pampa Hidroponía ERP</title>
<meta name="description" content="ERP de producción hidropónica: cultivos, sectores, solución nutritiva, sensores, cosecha, trazabilidad y rentabilidad.">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PampaHidro">
<link rel="icon" href="pampa/logo-sm-esquina.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pampa/brand.css">
<style>
/* === CSS VARIABLES === */
:root {
  --bg-primary: #0f1419;
  --bg-secondary: #1a1f2e;
  --bg-tertiary: #252b3b;
  --bg-card: #1e2433;
  --border: #2d3548;
  --border-light: #3d4558;
  --green: #f59e0b;
  --green-dim: #d97706;
  --green-glow: rgba(245,158,11,0.15);
  --blue: #3b82f6;
  --blue-dim: #2563eb;
  --purple: #8b5cf6;
  --orange: #f97316;
  --red: #ef4444;
  --yellow: #eab308;
  --cyan: #06b6d4;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-dim: #64748b;
  --font-main: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sidebar-w: 280px;
  --header-h: 60px;
  --radius: 8px;
  --radius-lg: 12px;
}

/* === RESET === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
}

/* === LAYOUT === */
.app { display: flex; height: 100vh; }

/* === SIDEBAR === */
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  height: 100vh;
  overflow-y: auto;
  scroll-behavior: smooth;
}

/* Estilo del scrollbar en sidebar */
.sidebar::-webkit-scrollbar {
  width: 8px;
}
.sidebar::-webkit-scrollbar-track {
  background: transparent;
}
.sidebar::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}
.sidebar::-webkit-scrollbar-thumb:hover {
  background: var(--text-dim);
}
.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.logo-icon {
  width: 140px; height: 140px;
  background: url('logo2.png') center/contain no-repeat;
  display: flex; align-items: center; justify-content: center;
  padding: 10px;
  border-radius: 16px;
  background-color: rgba(255,255,255,0.08);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}
.logo-text { font-weight: 700; font-size: 16px; text-align: center; }
.logo-sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); text-align: center; }

/* Portada Empresa - Dashboard */
.empresa-portada {
  position: relative;
  background: linear-gradient(135deg, #0f5132 0%, #14532d 40%, #1a7f3e 100%);
  border-radius: 12px;
  padding: 12px 20px 24px 20px;
  margin-bottom: 0;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  border: 1px solid rgba(245, 158, 11, 0.16);
  min-height: 420px;
}
.dashboard-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-items: start;
  margin-bottom: 18px;
}
.dashboard-empresa-col {
  display: flex;
  flex-direction: column;
  height: 100%;
  gap: 10px;
}
.empresa-portada::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.empresa-portada::after {
  content: '🌾';
  position: absolute;
  right: 24px; bottom: -20px;
  font-size: 160px;
  opacity: 0.08;
  pointer-events: none;
}
.empresa-portada-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  justify-content: center;
  height: 100%;
}
.empresa-portada-logo {
  width: 480px; height: 280px;
  background-color: transparent;
  background-image: url('logo2.png');
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
  border-radius: 0;
  flex-shrink: 0;
  border: none;
}
.empresa-portada-info { 
  flex: 1; 
  min-width: 260px; 
  text-align: center;
  width: 100%;
}
.empresa-portada-nombre {
  font-size: 28px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  text-align: center;
}
.empresa-portada-sub {
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  font-family: var(--font-mono);
  margin-bottom: 10px;
}
.empresa-portada-datos {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  font-size: 11px;
  color: rgba(255,255,255,0.9);
  justify-content: center;
}
.empresa-portada-datos span { display: inline-flex; align-items: center; gap: 6px; }
.empresa-portada-datos strong { color: #fff; font-weight: 600; }
.empresa-portada-fecha {
  position: relative;
  z-index: 2;
  text-align: right;
  color: rgba(255,255,255,0.85);
  font-family: var(--font-mono);
  font-size: 12px;
  padding-top: 4px;
}
.dashboard-top-actions {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dashboard-top-actions-title {
  font-size: 12px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: var(--font-mono);
}
.dashboard-date-chip {
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 10px;
}
.dashboard-date-chip strong {
  color: var(--text-primary);
  font-weight: 600;
}
.dashboard-top-actions-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.dashboard-action-btn {
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.dashboard-action-btn:hover {
  border-color: var(--green);
  color: var(--green);
}
.wa-mini-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  margin-right: 10px;
  border-radius: 50%;
  background: #25d366;
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  flex-shrink: 0;
}
.dashboard-action-btn.whatsapp-action {
  grid-column: 1 / -1;
  justify-self: center;
  width: min(100%, 220px);
  min-height: 46px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  font-size: 12px;
}
.dashboard-action-btn.whatsapp-action .wa-mini-icon {
  width: 30px;
  height: 30px;
  font-size: 11px;
  margin-right: 10px;
}
.dashboard-role-select {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.dashboard-role-select:focus {
  outline: none;
  border-color: var(--green);
}
.dashboard-sync-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.portada-market-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  align-items: center;
  margin-top: auto;
  margin-bottom: auto;
}
.empresa-portada-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.empresa-portada-tool-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-light);
  background: var(--bg-card);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 12px;
  min-height: 40px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.empresa-portada-tool-btn:hover {
  background: var(--bg-tertiary);
  border-color: var(--green);
  transform: translateY(-1px);
}
@media (max-width: 640px) {
  .dashboard-hero {
    grid-template-columns: 1fr;
  }
  .dashboard-top-actions-grid {
    grid-template-columns: 1fr;
  }
  .empresa-portada { padding: 20px; }
  .empresa-portada-nombre { font-size: 22px; }
  .empresa-portada-content { gap: 16px; }
  .logo-icon { width: 115px; height: 115px; }
  .empresa-portada-logo { width: 76px; height: 76px; }
  .empresa-portada-tool-btn {
    width: 100%;
    text-align: left;
  }
}

.sidebar-nav { flex: 1; padding: 16px 12px; }
.nav-section { margin-bottom: 20px; }
.nav-section-title {
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text-primary);
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 12px 12px 8px 12px;
  margin-bottom: 10px;
  border-bottom: 2px solid var(--border);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all 0.15s;
  user-select: none;
}
.nav-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.nav-item.active {
  background: var(--green-glow);
  color: var(--green);
  font-weight: 500;
}
.nav-icon { width: 20px; text-align: center; font-size: 16px; }
.nav-badge {
  margin-left: auto;
  font-size: 10px;
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--text-dim);
}

.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 2100;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  z-index: 2050;
}

.sidebar-backdrop.active {
  display: block;
}

/* === MAIN === */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main.dashboard-compact .topbar { display: none; }
.topbar {
  height: var(--header-h);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
}
.topbar { display: none !important; }
.topbar-title { font-weight: 600; font-size: 16px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.topbar-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.topbar-btn:hover { border-color: var(--green); color: var(--green); }
.topbar-btn.primary { background: var(--green); color: white; border-color: var(--green); }

.content { flex: 1; overflow-y: auto; padding: 24px; }
.content::-webkit-scrollbar { width: 8px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* === MODULES === */
.module { display: none; animation: fadeIn 0.3s ease; }
.module.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* === CARDS === */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }

/* === KPI CARDS === */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
.kpi {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.kpi.green::before { background: var(--green); }
.kpi.blue::before { background: var(--blue); }
.kpi.purple::before { background: var(--purple); }
.kpi.orange::before { background: var(--orange); }
.kpi.red::before { background: var(--red); }
.kpi.cyan::before { background: var(--cyan); }
.kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.kpi-value { font-size: 28px; font-weight: 700; font-family: var(--font-mono); }
.kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

/* === GRIDS === */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

/* === TABLES === */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left;
  padding: 12px;
  background: var(--bg-tertiary);
  color: var(--text-dim);
  font-weight: 500;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
}
.data-table td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-secondary);
}
.data-table tr:hover td { background: rgba(16,185,129,0.03); }

/* === TAGS === */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
.tag.green { background: rgba(16,185,129,0.15); color: var(--green); }
.tag.blue { background: rgba(59,130,246,0.15); color: var(--blue); }
.tag.orange { background: rgba(245,158,11,0.15); color: var(--orange); }
.tag.red { background: rgba(239,68,68,0.15); color: var(--red); }

/* === CHARTS === */
.chart-container { position: relative; height: 300px; }

/* === FORMS === */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.form-input, .form-select {
  width: 100%;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.form-input:focus, .form-select:focus { border-color: var(--green); }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

/* === ALERTS === */
.alert-list { display: flex; flex-direction: column; gap: 8px; }
.alert-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-tertiary);
  border-radius: 6px;
  border-left: 3px solid var(--orange);
}
.alert-item.critical { border-left-color: var(--red); }
.alert-item.success { border-left-color: var(--green); }
.alert-icon { font-size: 18px; }
.alert-text { flex: 1; font-size: 13px; }
.alert-time { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }

/* === MODAL === */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-weight: 600; font-size: 16px; }
.modal-close {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 24px;
  cursor: pointer;
  padding: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
}
.modal-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }
.modal-body { padding: 20px; }
.modal-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}
.btn {
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  transition: all 0.15s;
}
.btn:hover { border-color: var(--green); }
.btn-primary { background: var(--green); border-color: var(--green); color: white; }
.btn-primary:hover { background: var(--green-dim); }
.btn-danger { background: var(--red); border-color: var(--red); color: white; }
.btn-danger:hover { opacity: 0.9; }

/* === SYNC STATUS INDICATOR === */
.sync-status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.sync-status.online {
  background: var(--green-glow);
  color: var(--green);
  border: 1px solid var(--green);
}

.sync-status.offline {
  background: rgba(239, 68, 68, 0.15);
  color: var(--red);
  border: 1px solid var(--red);
}

.sync-status.syncing {
  background: rgba(59, 130, 246, 0.15);
  color: var(--blue);
  border: 1px solid var(--blue);
}

.sync-icon {
  font-size: 14px;
  animation: none;
}

.sync-status.syncing .sync-icon {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.sync-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10001;
}

.sync-modal.active {
  display: flex;
}

.sync-modal-content {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 30px;
  max-width: 500px;
  width: 90%;
}

.sync-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.sync-modal-title {
  font-size: 18px;
  font-weight: 600;
}

.sync-info {
  background: var(--bg-tertiary);
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.sync-info-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 13px;
}

.sync-info-label {
  color: var(--text-dim);
}

.sync-info-value {
  color: var(--text-primary);
  font-weight: 500;
}

/* === LICENCIA ACTIVATION SCREEN === */
.activation-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}

.activation-container {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 40px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.activation-header {
  text-align: center;
  margin-bottom: 30px;
}

.activation-logo {
  width: 120px;
  height: 120px;
  background: url('logo.png') center/contain no-repeat;
  margin: 0 auto 20px;
}

.activation-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 8px;
}

.activation-subtitle {
  color: var(--text-dim);
  font-size: 14px;
}

.activation-form {
  margin-bottom: 20px;
}

.activation-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-secondary);
}

.activation-input {
  width: 100%;
  padding: 12px 16px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 14px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.activation-input:focus {
  outline: none;
  border-color: var(--green);
}

.activation-btn {
  width: 100%;
  padding: 12px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
}

.activation-btn:hover {
  background: var(--green-dim);
}

.activation-btn-secondary {
  margin-top: 10px;
  width: 100%;
  padding: 11px;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}

.activation-btn-secondary:hover {
  border-color: var(--green);
  color: var(--green);
  background: rgba(245,158,11,0.08);
}

.activation-info {
  text-align: center;
  padding: 16px;
  background: var(--bg-tertiary);
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.6;
}

.activation-error {
  color: var(--red);
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}

.activation-success {
  text-align: center;
  padding: 30px;
}

.activation-success-icon {
  font-size: 64px;
  margin-bottom: 20px;
}

.license-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--green-glow);
  border: 1px solid var(--green);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--green);
  font-family: var(--font-mono);
}

/* === TOAST === */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  z-index: 2000;
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: rgba(16,185,129,0.9); border: 1px solid rgba(16,185,129,1); color: #ffffff; }
.toast.error { background: rgba(239,68,68,0.92); border: 1px solid rgba(239,68,68,1); color: #ffffff; }
.toast.info { background: rgba(59,130,246,0.9); border: 1px solid rgba(59,130,246,1); color: #ffffff; }

/* === UPLOAD ZONE === */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 16px;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--green);
  background: var(--green-glow);
}
.upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
.upload-zone .title { font-weight: 600; margin-bottom: 4px; }
.upload-zone .subtitle { font-size: 12px; color: var(--text-dim); }

/* === MOBILE === */
@media (max-width: 768px) {
  .mobile-menu-btn { display: inline-flex; align-items: center; gap: 6px; }
  .app { flex-direction: column; }
  .sidebar {
    display: flex;
    flex-direction: column;
    position: fixed;
    left: -100%;
    top: 0;
    bottom: 0;
    width: min(86vw, 320px);
    z-index: 2000;
    transition: left 0.25s ease;
    border-right: 1px solid var(--border);
    border-top: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .sidebar.open { left: 0; }
  .main {
    width: 100%;
    min-height: 100vh;
    position: static;
    inset: auto;
    overflow-y: visible;
    background: var(--bg-primary);
  }
  .content {
    padding: 56px 16px 16px;
  }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* === REPORT CARDS === */
.report-card {
  padding: 16px;
  background: var(--bg-tertiary);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.report-card:hover {
  border-color: var(--green);
  background: var(--bg-card-hover);
  transform: translateY(-2px);
}

;font-weight:700;cursor:pointer}.pampaia-btn:hover{border-color:#f59e0b;color:#fbbf24}.pampaia-question{display:flex;gap:7px;margin-top:8px}.pampaia-question input{flex:1;min-width:0;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:7px;padding:9px 10px;font-size:11px;outline:none}.pampaia-question button{border:0;background:#f59e0b;color:#102a1d;border-radius:7px;padding:0 12px;font-weight:800;cursor:pointer}.pampaia-answer{margin-top:9px;padding:9px 10px;border-left:3px solid #f59e0b;background:rgba(245,158,11,.08);border-radius:0 7px 7px 0;color:#eaf5ee;font-size:11px;line-height:1.45;min-height:34px}.pampaia-foot{margin-top:9px;font-size:9px;color:#7fa38e}.pampaia-report-btn{float:right;margin-top:-3px;border:1px solid rgba(245,158,11,.3);background:transparent;color:#fbbf24;border-radius:6px;padding:5px 8px;font-size:10px;cursor:pointer}@media(max-width:900px){.pampaia-grid{grid-template-columns:1fr}.pampaia-head{flex-direction:column}}

a.tag { cursor: pointer; text-decoration: none; }
.timeline { margin-top: 16px; border-left: 2px solid var(--border); padding-left: 14px; }
.tl-item { display: flex; gap: 12px; padding: 8px 0; position: relative; }
.tl-icon { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-tertiary); margin-left: -30px; flex: 0 0 30px; border: 1px solid var(--border); }
.tl-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.tl-det { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.traz-resumen > div { background: var(--bg-tertiary); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.import-sum { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.import-opt { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; }
.report-card .report-icon { font-size: 26px; }
.report-card .report-title { font-weight: 700; margin: 6px 0 4px; }
.report-card .report-desc { font-size: 12px; color: var(--text-secondary); }
.chart-container { position: relative; height: 260px; }
#pampaiaHolder { display: none; }

  .form-grid { grid-template-columns: 1fr; }
  .module-actions { justify-content: flex-start; }
  .dashboard-hero { grid-template-columns: 1fr; }
  .empresa-portada { min-height: 0; }
  .filter-bar .form-input, .filter-bar .form-select { min-width: 0; width: 100%; }

<button class="mobile-menu-btn" id="mobileMenuBtn" type="button">☰ Menú</button>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"></div>
      <div><div class="logo-text">PAMPA</div><div class="logo-sub">HIDROPONÍA</div></div>
    </div>
    <nav class="sidebar-nav"><div id="hidroMenu"></div></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar-title" id="topbarTitle">Dashboard</span>
      <div class="topbar-right">
        <div class="sync-status offline" id="syncStatus" data-ir="sincronizacion" title="Estado de conexión y sincronización">
          <span class="sync-icon">⚡</span><span class="sync-text">Sin conexión</span>
        </div>
        <select class="topbar-btn" data-hidro-rol title="Rol activo" style="background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);padding:6px 12px;border-radius:6px;cursor:pointer"></select>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="pampaiaHolder"></div>

<!-- Formulario de alta y edición (lo usan todos los módulos) -->
<div class="modal-overlay" id="formModal">
  <form class="modal" id="formModalForm" novalidate>
    <div class="modal-header"><div class="modal-title" id="formModalTitle">Nuevo registro</div><button type="button" class="modal-close" data-cerrar-form aria-label="Cerrar">✕</button></div>
    <div class="modal-body" id="formModalBody"></div>
    <div class="modal-footer"><button type="button" class="btn" data-cerrar-form>Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>
  </form>
</div>

<!-- Importación de datos históricos desde Excel -->
<div class="modal-overlay" id="importModal">
  <div class="modal modal-wide">
    <div class="modal-header"><div class="modal-title" id="importTitle">Importar desde Excel</div><button type="button" class="modal-close" data-cerrar-import aria-label="Cerrar">✕</button></div>
    <div class="modal-body" id="importBody"></div>
    <div class="modal-footer"><button type="button" class="btn" data-cerrar-import>Cancelar</button><button type="button" class="btn btn-primary" id="importConfirm" style="display:none">Importar</button></div>
  </div>
</div>

<!-- Activación de licencia (versión de escritorio) -->
<div class="activation-overlay" id="activationOverlay" style="display:none">
  <div class="activation-container">
    <div class="activation-header"><div class="activation-logo"></div><div class="activation-title">Pampa Hidroponía</div><div class="activation-subtitle">ERP de producción hidropónica</div></div>
    <div class="activation-form">
      <label class="activation-label" for="activationKey">Licencia de activación</label>
      <textarea class="activation-input" id="activationKey" rows="4" placeholder="Pegá acá el token PAMPAN1 completo" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button class="activation-btn-secondary" type="button" onclick="pasteLicenseFromClipboard()">Pegar desde portapapeles</button>
      <div class="activation-error" id="activationError">Clave de activación inválida</div>
      <button class="activation-btn" type="button" onclick="activateLicense()">Activar</button>
      <div class="activation-info">¿No tenés licencia? Escribinos por WhatsApp desde la web de Pampa N.</div>
    </div>
  </div>
</div>
